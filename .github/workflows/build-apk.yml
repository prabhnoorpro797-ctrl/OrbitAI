name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [[ -f ./gradlew && -f ./settings.gradle.kts ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f ./OrbitAI/settings.gradle.kts ]]; then
            echo "dir=OrbitAI" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts at repository root or ./OrbitAI" >&2
            find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -print
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper if missing
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [[ ! -f ./gradlew ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ai-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
